<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宅配メモマップ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* 上部検索＆操作バー */
    .top-container { position: fixed; top: 54px; left: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .search-row { display: flex; gap: 6px; pointer-events: auto; align-items: center; }
    .search-box-wrap { flex: 1; position: relative; display: flex; align-items: center; min-width: 0; }
    .search-input { width: 100%; padding: 11px 34px 11px 12px; border: 2px solid #333; border-radius: 10px; font-size: 15px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
    .clear-input-btn { position: absolute; right: 8px; background: #e5e7eb; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; color: #333; cursor: pointer; display: none; align-items: center; justify-content: center; }
    .btn { pointer-events: auto; padding: 10px 12px; background: #fff; border: 2px solid #333; border-radius: 10px; font-weight: bold; font-size: 14px; box-shadow: 0 3px 8px rgba(0,0,0,0.2); cursor: pointer; white-space: nowrap; }
    .btn-qr { background: #111827; color: #fff; border-color: #111827; }

    /* ズームボタンを検索バーの下へ移動 */
    .leaflet-top.leaflet-left { top: 108px !important; left: 2px !important; }

    /* 予測検索結果リスト */
    .search-results { pointer-events: auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); max-height: 290px; overflow-y: auto; display: none; border: 1px solid #ccc; }
    .search-item { padding: 11px 12px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; line-height: 1.4; }
    .search-item:last-child { border-bottom: none; }
    .search-item:active { background: #f3f4f6; }
    .badge-saved { display: inline-block; background: #16a34a; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    .badge-addr { display: inline-block; background: #2563eb; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    .badge-approx { display: inline-block; background: #f59e0b; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    .badge-dist { display: inline-block; background: #e5e7eb; color: #374151; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }

    /* 下部ステータス＆現在地ボタン */
    .status-pill { position: fixed; bottom: 32px; left: 14px; z-index: 1000; background: rgba(255,255,255,0.92); border: 1px solid #ccc; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .btn-gps { position: fixed; bottom: 28px; right: 16px; z-index: 1000; background: #2563eb; color: #fff; border: none; padding: 14px 18px; border-radius: 50px; font-size: 15px; }

    /* 現在地の青い丸マーク */
    .current-loc-dot {
      width: 18px;
      height: 18px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.8);
    }

    /* 仮ピン */
    .temp-pin-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
    }

    /* ポップアップ内ボタン */
    .popup-btn { display: block; width: 100%; text-align: center; margin-top: 6px; padding: 9px; border-radius: 6px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; font-size: 13px; }
    .gmap { background: #4285F4; color: #fff; }
    .add-here { background: #16a34a; color: #fff; }
    .edit { background: #f3f4f6; color: #111; border: 1px solid #ccc; }
    .del { background: #fee2e2; color: #b91c1c; }

    /* モーダル共通 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #fff; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; }
    .modal-box h3 { margin: 0 0 12px; }
    .modal-box input, .modal-box textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; font-size: 15px; cursor: pointer; }
    .save-btn { background: #16a34a; color: #fff; }
    .cancel-btn { background: #e5e7eb; color: #333; }

    /* QRカメラ枠 */
    #qr-reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="top-container">
    <div class="search-row">
      <div class="search-box-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="例: 倶知安 北1条 / 建物名 / メモ" oninput="onSearchInput()" onfocus="onSearchInput()" onkeydown="if(event.key==='Enter') executeSearch(true)">
        <button id="clearSearchBtn" class="clear-input-btn" onclick="clearSearchInput()">✕</button>
      </div>
      <button class="btn btn-qr" onclick="openQrScanner()">📷 QR</button>
      <button class="btn" onclick="loadPins()">🔄</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <div id="statusPill" class="status-pill">読込中...</div>
  <button class="btn btn-gps" onclick="moveToCurrentLocation()">📍 現在地</button>
  <div id="map"></div>

  <!-- 登録・編集モーダル -->
  <div id="formModal" class="modal">
    <div class="modal-box">
      <h3 id="modalTitle">配達メモを登録</h3>
      <input type="text" id="inputName" placeholder="住所・建物名・表札（必須）">
      <textarea id="inputMemo" rows="3" placeholder="オートロック番号、置き配場所、注意点など"></textarea>
      <input type="text" id="inputStaff" placeholder="登録者名（例：佐藤）">
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
        <button class="save-btn" onclick="savePin()">保存する</button>
      </div>
    </div>
  </div>

  <!-- QRスキャナーモーダル -->
  <div id="qrModal" class="modal">
    <div class="modal-box">
      <h3>📷 QRコードを読み取る</h3>
      <div id="qr-reader"></div>
      <div style="font-size:12px; color:#555; margin-bottom:10px;">
        ※住所文字や地図URLが入ったQRコードを読み取ると自動で場所を検索します。
      </div>
      <button class="cancel-btn" style="width:100%; padding:12px; border-radius:8px; border:none; font-weight:bold;" onclick="closeQrScanner()">閉じる</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxJnOzcP3Hq_oljFrjz_7TmkK3D17l4cDLcUNAjfQmiZqfzEzv4c3InT16mPh2Vrc8j/exec";
    const APP_PASS = "1234";
    const DEFAULT_LAT = 42.9018;
    const DEFAULT_LNG = 140.7586;
    // 省略検索時に自動補完するベース地域名
    const DEFAULT_AREA_PREFIX = "北海道虻田郡倶知安町";

    if (APP_PASS && localStorage.getItem("delivery_auth") !== APP_PASS) {
      const input = prompt("スタッフ用パスワードを入力してください：");
      if (input === APP_PASS) {
        localStorage.setItem("delivery_auth", APP_PASS);
      } else {
        document.body.innerHTML = "<h3 style='padding:20px;'>パスワードが違います。再読み込みしてください。</h3>";
        throw new Error("Auth failed");
      }
    }

    document.getElementById("inputStaff").value = localStorage.getItem("delivery_staff") || "";

    const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let markerMap = {};
    let draftMarker = null;
    let currentData = [];
    let editingPin = null;
    let tempLatLng = null;

    let myMarker = null;
    let myCircle = null;
    let lastPos = null;
    const myIcon = L.divIcon({
      className: 'current-loc-dot',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    const draftIcon = L.divIcon({
      className: 'temp-pin-icon',
      html: '📍',
      iconSize: [32, 32],
      iconAnchor: [16, 30],
      popupAnchor: [0, -28]
    });

    function updateMyLocation(pos, moveCamera) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      lastPos = [lat, lng];

      if (!myMarker) {
        myMarker = L.marker([lat, lng], { icon: myIcon, zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup("<b>現在地</b>");
        myCircle = L.circle([lat, lng], {
          radius: acc, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.15, weight: 1
        }).addTo(map);
      } else {
        myMarker.setLatLng([lat, lng]);
        myCircle.setLatLng([lat, lng]).setRadius(acc);
      }
      if (moveCamera) map.setView([lat, lng], 17);
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => updateMyLocation(pos, true), () => {});
      navigator.geolocation.watchPosition(pos => updateMyLocation(pos, false), () => {}, { enableHighAccuracy: true });
    }

    function moveToCurrentLocation() {
      if (lastPos) map.setView(lastPos, 17);
      if (!navigator.geolocation) { alert("GPSに対応していません"); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        updateMyLocation(pos, true);
      }, () => alert("現在地を取得できませんでした"), { enableHighAccuracy: true });
    }

    function calcDistanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 表記ゆれ吸収（全角→半角、漢数字→算用数字、ハイフン統一）
    function normalizeText(str) {
      const kanjiMap = {'一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','〇':'0'};
      return String(str || "")
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[一二三四五六七八九〇]/g, s => kanjiMap[s] || s)
        .replace(/[ー－―‐]/g, "-")
        .toLowerCase();
    }

    // 入力された文字列を「検索キーワードの塊」に分解（例: "倶知安北1条東3" → ["倶知安", "北1条", "東3"]）
    function tokenizeQuery(raw) {
      const norm = normalizeText(raw).trim();
      if (!norm) return [];
      // スペース区切りがあれば分割、さらに「北1条東3丁目」のような連続文字も境界で分割してAND検索しやすくする
      const spaceParts = norm.split(/[\s　,、]+/).filter(Boolean);
      const tokens = [];
      spaceParts.forEach(part => {
        // 「北海道」「虻田郡」が入力されていてもいなくても比較できるように除去したトークンも作る
        const cleaned = part.replace(/^(北海道|虻田郡)/g, "");
        if (cleaned) tokens.push(cleaned);
      });
      return tokens;
    }

    // ==========================================
    // リアルタイム入力予測（オートコンプリート）
    // ==========================================
    let searchTimer = null;

    function onSearchInput() {
      const val = document.getElementById("searchInput").value;
      const clearBtn = document.getElementById("clearSearchBtn");
      clearBtn.style.display = val ? "flex" : "none";

      if (!val.trim()) {
        document.getElementById("searchResults").style.display = "none";
        return;
      }

      // 1. まずスプレッドシート内の登録メモを「0ミリ秒（即座）」に予測表示
      renderSavedInstant(val);

      // 2. 入力が0.35秒止まったら外部の住所候補も取得して合流させる
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        executeSearch(false);
      }, 350);
    }

    function clearSearchInput() {
      const input = document.getElementById("searchInput");
      input.value = "";
      document.getElementById("clearSearchBtn").style.display = "none";
      document.getElementById("searchResults").style.display = "none";
      input.focus();
    }

    function getSavedMatches(rawQuery) {
      const center = lastPos ? { lat: lastPos[0], lng: lastPos[1] } : map.getCenter();
      const tokens = tokenizeQuery(rawQuery);
      if (tokens.length === 0) return [];

      return currentData
        .filter(d => {
          // 登録データの住所・建物名・メモ・担当者名を連結して、スペースを詰めた文字列を作る
          const targetCompact = normalizeText((d.name || "") + " " + (d.memo || "") + " " + (d.staff || "")).replace(/[\s　]+/g, "");
          // 入力されたすべてのキーワードが含まれていればヒット（「虻田郡」が抜けていてもOK）
          return tokens.every(t => targetCompact.includes(t));
        })
        .map(d => ({
          type: "saved",
          id: d.id,
          title: d.name,
          sub: d.memo,
          lat: d.lat,
          lng: d.lng,
          dist: calcDistanceKm(center.lat, center.lng, d.lat, d.lng)
        }))
        .sort((a, b) => a.dist - b.dist);
    }

    function renderSavedInstant(rawQuery) {
      const resultsBox = document.getElementById("searchResults");
      const savedMatches = getSavedMatches(rawQuery);

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "";

      savedMatches.forEach(item => {
        resultsBox.appendChild(createSavedItemEl(item));
      });

      const loadingDiv = document.createElement("div");
      loadingDiv.id = "webLoadingHint";
      loadingDiv.className = "search-item";
      loadingDiv.style.color = "#666";
      loadingDiv.style.fontSize = "12px";
      loadingDiv.innerText = "住所候補を検索中...";
      resultsBox.appendChild(loadingDiv);
    }

    function createSavedItemEl(item) {
      const div = document.createElement("div");
      div.className = "search-item";
      const distText = item.dist < 1 ? `${Math.round(item.dist * 1000)}m` : `${item.dist.toFixed(1)}km`;
      div.innerHTML = `<span class="badge-saved">登録済</span><b>${esc(item.title)}</b><span class="badge-dist">${distText}</span>` +
                      (item.sub ? `<div style="font-size:12px; color:#555; margin-top:2px;">${esc(item.sub)}</div>` : "");
      div.onclick = () => {
        document.getElementById("searchResults").style.display = "none";
        map.setView([item.lat, item.lng], 17);
        if (markerMap[item.id]) markerMap[item.id].openPopup();
      };
      return div;
    }

    async function executeSearch(isEnterKey) {
      const rawQuery = document.getElementById("searchInput").value.trim();
      const resultsBox = document.getElementById("searchResults");
      if (!rawQuery) { resultsBox.style.display = "none"; return; }

      // 緯度・経度が直接入力された場合
      const coordMatch = rawQuery.match(/^(-?\d{1,2}\.\d{4,})[,\s/]+(-?\d{1,3}\.\d{4,})$/);
      if (coordMatch) {
        resultsBox.style.display = "none";
        const lat = Number(coordMatch[1]);
        const lng = Number(coordMatch[2]);
        placeDraftPin(lat, lng, "指定座標 (" + lat.toFixed(5) + ", " + lng.toFixed(5) + ")");
        return;
      }

      const center = lastPos ? { lat: lastPos[0], lng: lastPos[1] } : map.getCenter();
      const savedMatches = getSavedMatches(rawQuery);

      // 住所検索用のクエリ整形（スペース削除・全角→半角）
      const cleanAddr = normalizeText(rawQuery).replace(/[\s　]+/g, "");
      // 「北海道」や「倶知安」が抜けていたら補完したクエリも作る（例: "北1条東3" → "北海道虻田郡倶知安町北1条東3"）
      let expandedAddr = cleanAddr;
      if (!cleanAddr.includes("倶知安") && !cleanAddr.includes("北海道") && !cleanAddr.includes("ニセコ") && !cleanAddr.includes("京極")) {
        expandedAddr = DEFAULT_AREA_PREFIX + cleanAddr;
      } else if (cleanAddr.includes("倶知安") && !cleanAddr.includes("北海道")) {
        expandedAddr = "北海道虻田郡" + cleanAddr.replace(/^倶知安町?/, "倶知安町");
      }

      // 番地削りバリエーションも用意
      const stripBanchi = s => s.replace(/(\d+番地?\d*号?|\d+-\d+(-\d+)?|\d+号)$/, "");
      const queriesToTry = Array.from(new Set([
        expandedAddr,
        cleanAddr,
        stripBanchi(expandedAddr),
        stripBanchi(cleanAddr)
      ])).filter(s => s && s.length >= 2);

      let webMatches = [];
      let isApprox = false;

      for (let i = 0; i < queriesToTry.length; i++) {
        const qTry = queriesToTry[i];
        try {
          const dLat = 0.15;
          const dLng = 0.20;
          const viewbox = `${center.lng - dLng},${center.lat + dLat},${center.lng + dLng},${center.lat - dLat}`;

          const [gsiRes, osmRes] = await Promise.all([
            fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(qTry)}`).then(r => r.json()).catch(() => []),
            fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&viewbox=${viewbox}&bounded=0&limit=6&q=${encodeURIComponent(qTry)}`).then(r => r.json()).catch(() => [])
          ]);

          gsiRes.forEach(d => {
            const lat = d.geometry.coordinates[1];
            const lng = d.geometry.coordinates[0];
            webMatches.push({
              type: "web",
              title: d.properties.title,
              lat,
              lng,
              dist: calcDistanceKm(center.lat, center.lng, lat, lng)
            });
          });

          osmRes.forEach(d => {
            const lat = Number(d.lat);
            const lng = Number(d.lon);
            webMatches.push({
              type: "web",
              title: d.display_name.replace(/, 日本$/, ""),
              lat,
              lng,
              dist: calcDistanceKm(center.lat, center.lng, lat, lng)
            });
          });

          if (webMatches.length > 0) {
            if (i >= 2) isApprox = true;
            break;
          }
        } catch (e) {}
      }

      // 入力途中で文字が変わっていたら古い通信結果は破棄
      if (document.getElementById("searchInput").value.trim() !== rawQuery) return;

      // 重複タイトルを整理して距離順に並べる
      const seen = new Set();
      webMatches = webMatches
        .sort((a, b) => a.dist - b.dist)
        .filter(item => {
          const key = item.title + item.lat.toFixed(4);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .slice(0, 7);

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "";

      savedMatches.forEach(item => {
        resultsBox.appendChild(createSavedItemEl(item));
      });

      webMatches.forEach(item => {
        const div = document.createElement("div");
        div.className = "search-item";
        const distText = item.dist < 1 ? `${Math.round(item.dist * 1000)}m` : `${item.dist.toFixed(1)}km`;
        const badge = isApprox ? `<span class="badge-approx">付近エリア</span>` : `<span class="badge-addr">住所候補</span>`;
        div.innerHTML = `${badge}${esc(item.title)}<span class="badge-dist">${distText}</span>`;
        div.onclick = () => {
          resultsBox.style.display = "none";
          placeDraftPin(item.lat, item.lng, isApprox ? rawQuery : item.title);
        };
        resultsBox.appendChild(div);
      });

      // Googleマップアプリで直接見るリンク
      const gmapSearchDiv = document.createElement("div");
      gmapSearchDiv.className = "search-item";
      gmapSearchDiv.style.background = "#eff6ff";
      gmapSearchDiv.style.color = "#1d4ed8";
      gmapSearchDiv.style.fontWeight = "bold";
      gmapSearchDiv.innerHTML = `🗺️ Googleマップアプリで「${esc(rawQuery)}」を開く ↗`;
      gmapSearchDiv.onclick = () => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rawQuery)}`, "_blank");
      };
      resultsBox.appendChild(gmapSearchDiv);
    }

    // 地図タップ時に逆ジオコーディングで住所名を自動取得して仮ピンを立てる
    async function placeDraftPin(lat, lng, defaultName) {
      if (draftMarker) map.removeLayer(draftMarker);
      map.setView([lat, lng], Math.max(map.getZoom(), 17));

      let resolvedName = defaultName;
      if (!resolvedName) {
        try {
          const res = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`);
          const data = await res.json();
          if (data && data.results && data.results.lv01Nm) {
            resolvedName = data.results.lv01Nm;
          }
        } catch (e) {}
      }

      const gmapUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
      const label = resolvedName ? `<b>${esc(resolvedName)}</b><br>` : `<b>選択した場所</b><br>`;

      draftMarker = L.marker([lat, lng], { icon: draftIcon, zIndexOffset: 900 }).addTo(map)
        .bindPopup(`
          <div style="min-width:190px;">
            ${label}
            <div style="font-size:11px; color:#666; margin-bottom:6px;">ズレている場合は建物の位置をタップして調整できます</div>
            <button class="popup-btn add-here" onclick="openAddAt(${lat}, ${lng}, '${esc(resolvedName || "")}')">＋ ここに配達メモを登録</button>
            <a href="${gmapUrl}" target="_blank" class="popup-btn gmap">📍 Googleマップでナビ</a>
            <button class="popup-btn edit" onclick="clearDraftPin()">✕ ピンを消す</button>
          </div>
        `).openPopup();
    }

    function clearDraftPin() {
      if (draftMarker) {
        map.removeLayer(draftMarker);
        draftMarker = null;
      }
    }

    map.on('click', function(e) {
      document.getElementById("searchResults").style.display = "none";
      placeDraftPin(e.latlng.lat, e.latlng.lng, "");
    });

    let html5QrCode = null;

    function openQrScanner() {
      document.getElementById("qrModal").style.display = "flex";
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          closeQrScanner();
          handleQrResult(decodedText);
        },
        () => {}
      ).catch(() => {
        alert("カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。");
        closeQrScanner();
      });
    }

    function closeQrScanner() {
      document.getElementById("qrModal").style.display = "none";
      if (html5QrCode) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
        html5QrCode = null;
      }
    }

    function handleQrResult(text) {
      const clean = text.trim();
      const coordMatch = clean.match(/(-?\d{1,2}\.\d{4,})[,\s/]+(-?\d{1,3}\.\d{4,})/);
      if (coordMatch) {
        const lat = Number(coordMatch[1]);
        const lng = Number(coordMatch[2]);
        placeDraftPin(lat, lng, "QR座標 (" + lat.toFixed(5) + ", " + lng.toFixed(5) + ")");
        return;
      }
      document.getElementById("searchInput").value = clean;
      onSearchInput();
    }

    async function loadPins() {
      const pill = document.getElementById("statusPill");
      pill.innerText = "読込中...";
      try {
        const res = await fetch(GAS_URL + "?t=" + Date.now());
        currentData = await res.json();
        renderPins();
        pill.innerText = `📍 登録済: ${currentData.length}件`;
      } catch (e) {
        pill.innerText = "⚠️ 読込エラー";
        alert("データの取得に失敗しました。GASのデプロイ設定を確認してください。");
      }
    }

    function renderPins() {
      markersLayer.clearLayers();
      markerMap = {};
      currentData.forEach(item => {
        const gmapUrl = `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`;
        const popupHtml = `
          <div style="min-width:180px;">
            <b style="font-size:15px;">${esc(item.name)}</b><br>
            <div style="margin:6px 0; white-space:pre-wrap; font-size:13px;">${esc(item.memo)}</div>
            <div style="font-size:11px; color:#666;">登録: ${esc(item.staff || "不明")}</div>
            <a href="${gmapUrl}" target="_blank" class="popup-btn gmap">📍 Googleマップでナビ</a>
            <button class="popup-btn edit" onclick="openEditModal('${item.id}')">✏️ メモを編集</button>
            <button class="popup-btn del" onclick="deletePin('${item.id}')">🗑️ 削除</button>
          </div>
        `;
        const m = L.marker([item.lat, item.lng]).addTo(markersLayer).bindPopup(popupHtml);
        markerMap[item.id] = m;
      });
    }

    function openAddAt(lat, lng, defaultName) {
      editingPin = null;
      tempLatLng = { lat, lng };
      document.getElementById("modalTitle").innerText = "新規配達メモを登録";
      document.getElementById("inputName").value = defaultName || "";
      document.getElementById("inputMemo").value = "";
      document.getElementById("formModal").style.display = "flex";
    }

    function openEditModal(id) {
      const target = currentData.find(d => String(d.id) === String(id));
      if (!target) return;
      editingPin = target;
      document.getElementById("modalTitle").innerText = "配達メモを編集";
      document.getElementById("inputName").value = target.name;
      document.getElementById("inputMemo").value = target.memo;
      document.getElementById("formModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("formModal").style.display = "none";
    }

    async function savePin() {
      const name = document.getElementById("inputName").value.trim();
      const memo = document.getElementById("inputMemo").value.trim();
      const staff = document.getElementById("inputStaff").value.trim();
      if (!name) { alert("建物名・表札を入力してください"); return; }

      localStorage.setItem("delivery_staff", staff);
      closeModal();
      clearDraftPin();

      if (editingPin) {
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "update", id: editingPin.id, name, memo, staff })
        });
      } else {
        const newId = "pin_" + Date.now();
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "add", id: newId, lat: tempLatLng.lat, lng: tempLatLng.lng, name, memo, staff })
        });
      }
      loadPins();
    }

    async function deletePin(id) {
      if (!confirm("この配達メモを削除しますか？")) return;
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", id })
      });
      loadPins();
    }

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    loadPins();
  </script>
</body>
</html>
